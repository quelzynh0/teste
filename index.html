<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Avaliação - Consultoria de Skincare Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="img/fotoperfil.jpg" alt="Foto de Perfil" class="profile-pic">
            <span>FICHA DE AVALIAÇÃO - CONSULTORIA DE SKINCARE ONLINE</span>
        </div>
        <div class="contact-info">
            <a href="https://api.whatsapp.com/send?phone=5513991766125" target="_blank" class="contact-link">
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    <path d="M15.6 14.8c-.2-.1-1.2-.4-1.4-.4-.2 0-.3.1-.4.3-.1.2-.4.4-.5.5-.1.1-.2.1-.4 0-.2-.1-.8-.3-1.5-.9-.5-.5-.9-1.1-1-1.3-.1-.2 0-.3.1-.4l.3-.3c.1-.1.2-.2.2-.3 0-.1 0-.2-.1-.3-.1-.1-.5-.6-.7-.8-.2-.2-.3-.2-.4-.1-.1.1-.3.3-.4.5-.2.2-.4.5-.4.7 0 .2.1.7.5 1.2.6.8 1.3 1.5 2.2 2 .8.4 1.6.6 2.3.6.2 0 .4 0 .6-.1.2-.1.5-.3.6-.5.1-.2.2-.4.2-.5 0-.2-.1-.3-.3-.4z"></path>
                </svg>
                (13) 99176-6125
            </a>
            <a href="https://instagram.com/eriika_esteticista" target="_blank" class="contact-link">
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                Érika Oliveira
            </a>
        </div>

        <form id="form-avaliacao" onsubmit="enviarParaWhatsApp(event)">
            <div class="section">
                <h2>DADOS PESSOAIS</h2>
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" oninput="atualizarAssinatura()">
                </div>
                <div class="form-group">
                    <label for="data-nascimento">Data de nascimento:</label>
                    <input type="date" id="data-nascimento" name="data-nascimento">
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf">
                </div>
                <div class="form-group">
                    <label for="rg">RG:</label>
                    <input type="text" id="rg" name="rg">
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" name="telefone">
                </div>
                <div class="form-group">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco">
                </div>
            </div>

            <div class="section">
                <h2>HISTÓRICO DE SAÚDE</h2>
                <div class="form-group">
                    <label>Já fez alguma cirurgia?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="cirurgia-sim" name="cirurgia" value="sim" onclick="toggleField('cirurgia-sim', 'cirurgia-qual')">
                        <label for="cirurgia-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="cirurgia-nao" name="cirurgia" value="nao" onclick="toggleField('cirurgia-sim', 'cirurgia-qual')">
                        <label for="cirurgia-nao">Não</label>
                    </div>
                    <div id="cirurgia-qual-container" style="display: none;">
                        <label for="cirurgia-qual">Qual?</label>
                        <input type="text" id="cirurgia-qual" name="cirurgia-qual">
                    </div>
                </div>
                <div class="form-group">
                    <label>Está gestante?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="gestante-sim" name="gestante" value="sim">
                        <label for="gestante-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="gestante-nao" name="gestante" value="nao">
                        <label for="gestante-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Problemas no fígado ou rim?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="figado-rim-sim" name="figado-rim" value="sim">
                        <label for="figado-rim-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="figado-rim-nao" name="figado-rim" value="nao">
                        <label for="figado-rim-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Você é fumante?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="fumante-sim" name="fumante" value="sim">
                        <label for="fumante-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="fumante-nao" name="fumante" value="nao">
                        <label for="fumante-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Toma algum remédio?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="remedio-sim" name="remedio" value="sim" onclick="toggleField('remedio-sim', 'remedio-qual')">
                        <label for="remedio-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="remedio-nao" name="remedio" value="nao" onclick="toggleField('remedio-sim', 'remedio-qual')">
                        <label for="remedio-nao">Não</label>
                    </div>
                    <div id="remedio-qual-container" style="display: none;">
                        <label for="remedio-qual">Qual?</label>
                        <input type="text" id="remedio-qual" name="remedio-qual">
                    </div>
                </div>
                <div class="form-group">
                    <label>Já teve hepatite?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="hepatite-sim" name="hepatite" value="sim">
                        <label for="hepatite-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="hepatite-nao" name="hepatite" value="nao">
                        <label for="hepatite-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Toma anticoncepcional?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="anticoncepcional-sim" name="anticoncepcional" value="sim" onclick="toggleField('anticoncepcional-sim', 'anticoncepcional-qual')">
                        <label for="anticoncepcional-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="anticoncepcional-nao" name="anticoncepcional" value="nao" onclick="toggleField('anticoncepcional-sim', 'anticoncepcional-qual')">
                        <label for="anticoncepcional-nao">Não</label>
                    </div>
                    <div id="anticoncepcional-qual-container" style="display: none;">
                        <label for="anticoncepcional-qual">Qual?</label>
                        <input type="text" id="anticoncepcional-qual" name="anticoncepcional-qual">
                    </div>
                </div>
                <div class="form-group">
                    <label>Tem diabetes?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="diabetes-sim" name="diabetes" value="sim">
                        <label for="diabetes-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="diabetes-nao" name="diabetes" value="nao">
                        <label for="diabetes-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Alergia a medicamento?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="alergia-sim" name="alergia" value="sim" onclick="toggleField('alergia-sim', 'alergia-qual')">
                        <label for="alergia-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="alergia-nao" name="alergia" value="nao" onclick="toggleField('alergia-sim', 'alergia-qual')">
                        <label for="alergia-nao">Não</label>
                    </div>
                    <div id="alergia-qual-container" style="display: none;">
                        <label for="alergia-qual">Qual?</label>
                        <input type="text" id="alergia-qual" name="alergia-qual">
                    </div>
                </div>
                <div class="form-group">
                    <label>Tem asma?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="asma-sim" name="asma" value="sim">
                        <label for="asma-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="asma-nao" name="asma" value="nao">
                        <label for="asma-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Sabe qual é a sua pressão?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="pressao-sim" name="pressao" value="sim" onclick="toggleField('pressao-sim', 'pressao-qual')">
                        <label for="pressao-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="pressao-nao" name="pressao" value="nao" onclick="toggleField('pressao-sim', 'pressao-qual')">
                        <label for="pressao-nao">Não</label>
                    </div>
                    <div id="pressao-qual-container" style="display: none;">
                        <label for="pressao-qual">Qual?</label>
                        <input type="text" id="pressao-qual" name="pressao-qual">
                    </div>
                </div>
                <div class="form-group">
                    <label>Tem problema cardíaco?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="cardiaco-sim" name="cardiaco" value="sim">
                        <label for="cardiaco-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="cardiaco-nao" name="cardiaco" value="nao">
                        <label for="cardiaco-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Faz tratamento médico?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="tratamento-sim" name="tratamento" value="sim" onclick="toggleField('tratamento-sim', 'tratamento-qual')">
                        <label for="tratamento-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="tratamento-nao" name="tratamento" value="nao" onclick="toggleField('tratamento-sim', 'tratamento-qual')">
                        <label for="tratamento-nao">Não</label>
                    </div>
                    <div id="tratamento-qual-container" style="display: none;">
                        <label for="tratamento-qual">Qual?</label>
                        <input type="text" id="tratamento-qual" name="tratamento-qual">
                    </div>
                </div>
                <div class="form-group">
                    <label>Já teve convulsão?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="convulsao-sim" name="convulsao" value="sim">
                        <label for="convulsao-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="convulsao-nao" name="convulsao" value="nao">
                        <label for="convulsao-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tem problema renal?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="renal-sim" name="renal" value="sim">
                        <label for="renal-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="renal-nao" name="renal" value="nao">
                        <label for="renal-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Costuma sentir tontura?</label>
                    <div class="checkbox-group">
                        <input type="radio" id="tontura-sim" name="tontura" value="sim">
                        <label for="tontura-sim">Sim</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" id="tontura-nao" name="tontura" value="nao">
                        <label for="tontura-nao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="pele">Como é a sua pele normalmente? De características:</label>
                    <textarea id="pele" name="pele" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="objetivo">Objetivo do tratamento:</label>
                    <textarea id="objetivo" name="objetivo" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="alimentacao">Como é a sua alimentação?</label>
                    <textarea id="alimentacao" name="alimentacao" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="rotina">Como é a sua rotina? Exemplo: pega muito sol, ar-condicionado</label>
                    <textarea id="rotina" name="rotina" rows="3"></textarea>
                </div>
            </div>

            <div class="section">
                <h2>TERMO DE COMPROMISSO</h2>
                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" name="data">
                </div>
                <div class="signature">
                    <label for="assinatura">Assinatura:</label>
                    <input type="text" id="assinatura" name="assinatura" readonly>
                    <p>Eu me responsabilizo por todas as informações aqui prestadas e autorizo o procedimento.</p>
                </div>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
